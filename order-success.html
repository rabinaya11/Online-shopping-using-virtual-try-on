<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmed - JOY BOUTIQUE</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .success-container {
            max-width: 600px;
            margin: 3rem auto;
            background: white;
            border-radius: 20px;
            padding: 2rem;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }
        .order-details {
            text-align: left;
            background: #f8f9fa;
            padding: 1rem;
            border-radius: 12px;
            margin: 1rem 0;
        }
        .btn {
            display: inline-block;
            padding: 0.6rem 1.2rem;
            background: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 30px;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="success-container">
        <h1>🎉 Order Placed Successfully!</h1>
        <p>Thank you for shopping with us.</p>
        <div id="order-details" class="order-details"></div>
        <a href="index.html" class="btn">Continue Shopping</a>
    </div>

    <script>
        const lastOrder = JSON.parse(localStorage.getItem('lastOrder'));
        if (lastOrder) {
            const container = document.getElementById('order-details');
            let itemsHtml = '<ul>';
            lastOrder.items.forEach(item => {
                itemsHtml += `<li>${item.name} x ${item.quantity} = ₹${parseInt(item.price.replace('₹', '')) * item.quantity}</li>`;
            });
            itemsHtml += '</ul>';
            container.innerHTML = `
                <p><strong>Order ID:</strong> ${lastOrder.id}</p>
                <p><strong>Date:</strong> ${lastOrder.date}</p>
                <p><strong>Customer:</strong> ${lastOrder.customer.name}</p>
                <p><strong>Mobile:</strong> ${lastOrder.customer.mobile}</p>
                <p><strong>Address:</strong> ${lastOrder.customer.address}</p>
                <p><strong>Size (if selected):</strong> ${lastOrder.customer.size || 'N/A'}</p>
                <p><strong>Items:</strong> ${itemsHtml}</p>
                <p><strong>Total:</strong> ₹${lastOrder.total}</p>
            `;
            localStorage.removeItem('lastOrder');
        } else {
            document.getElementById('order-details').innerHTML = '<p>No recent order found.</p>';
        }
    </script>
</body>
</html>
